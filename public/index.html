<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loot — Task List</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <h1>Loot</h1>
    <p class="tagline">Local-first task list</p>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="title-input" type="text" placeholder="Add a task…" maxlength="200" required>
      <button type="submit">Add</button>
    </form>

    <input id="search-input" class="search-input" type="search" placeholder="Filter tasks…" autocomplete="off" aria-label="Filter tasks">
    <p id="no-filter-match" class="empty" hidden>No tasks match your filter.</p>

    <div class="view-controls">
      <label>Status
        <select id="status-select" aria-label="Status filter">
          <option value="all">All</option>
          <option value="open">Open</option>
          <option value="done">Done</option>
        </select>
      </label>
      <label>Due
        <select id="due-select" aria-label="Due date filter">
          <option value="all">Any date</option>
          <option value="overdue">Overdue</option>
          <option value="dated">Has due date</option>
        </select>
      </label>
    </div>

    <div class="transfer">
      <button id="export-btn" type="button">Export</button>
      <button id="import-btn" type="button">Import</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks yet. Add one above.</p>
    <p id="status" class="status" role="status"></p>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
